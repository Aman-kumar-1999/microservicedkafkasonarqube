spring:
  application:
    name: apigatway
server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # URL of your Eureka Server
    register-with-eureka: true   # Register this service with Eureka
    fetch-registry: true         # Fetch registry cache to locate other services
  instance:
    prefer-ip-address: true