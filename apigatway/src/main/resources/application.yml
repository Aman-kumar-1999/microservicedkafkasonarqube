server:
  port: 8053
spring:
  cloud:
    gateway:
      routes:
        - id: order-services
          uri: lb://ORDER-SERVICES
          predicates:
            - Path=/order/**
          filters:
            - AuthenticationFilter
#
#
#        - id: restaurant-service
#          uri: lb://RESTAURANT-SERVICE
#          predicates:
#            - Path=/restaurant/**
#          filters:
#            - AuthenticationFilter

        - id: auth-services
          uri: lb://AUTH-SERVICES
          predicates:
            - Path=/auth/**

  application:
    name: API-GATEWAY

eureka:
  client:
    service-url:
      defaultZone : http://localhost:8761/eureka/






